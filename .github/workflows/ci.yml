# CI gate: lint + unit tests on every push / PR to main.
#
# Deliberately NOT running `next build` here — it needs amplify_outputs.json,
# which is generated by the Amplify pipeline (ampx pipeline-deploy) and is
# gitignored. The Amplify Hosting build remains the deploy gate; this workflow
# catches lint errors and broken finance math before they reach it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
